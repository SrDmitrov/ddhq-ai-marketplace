<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
{{CSS}}
</style>
<!--body-->
<div class="wrap">
  <header>
    <p class="sub">{{SUBTITLE}}</p>
    <div class="controls" role="group" aria-label="Playback">
      <div class="seg" role="group" aria-label="Speed">
        <button type="button" data-speed="2" aria-pressed="true">2×</button>
        <button type="button" data-speed="4" aria-pressed="false">4×</button>
      </div>
      <div class="seg" role="group" aria-label="Theme">
        <button type="button" data-theme-set="system" aria-pressed="true">System</button>
        <button type="button" data-theme-set="light" aria-pressed="false">Light</button>
        <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
      </div>
    </div>
  </header>

  <div class="stage">
  <div class="term" aria-label="Terminal replay">
    <div class="bar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="name"><h1>{{TITLE}}</h1><span class="win">{{WINDOW}}</span></div>
      <span class="progress" id="progress" aria-live="polite"></span>
    </div>
    <div class="scroll" id="scroll">
      <div id="log"></div>
      <div class="spin" id="spin" hidden><span id="glyph">✻</span><span><span class="verb" id="verb"></span> <span class="meta" id="meta"></span></span></div>
    </div>
    <div class="input">
      <div class="box"><span class="g">❯</span><span><span class="typed" id="typed"></span><span class="caret"></span></span></div>
      <div class="hint"><span>? for shortcuts</span><span>{{STATUS}}</span></div>
    </div>
  </div>
  </div>
  <div class="controls nav" role="group" aria-label="Turn navigation">
    <button id="start" type="button" title="Back to the start">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14m12-13-7 6 7 6"/></svg>Start
    </button>
    <button id="prev" type="button" title="Previous turn (Left Arrow)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>Previous
    </button>
    <button id="play" type="button" title="Play or pause">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="playIcon" d="M8 5v14M16 5v14"/></svg><span id="playLabel">Pause</span>
    </button>
    <button id="next" type="button" title="Next turn (Right Arrow)">
      Next<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
    </button>
    <button id="end" type="button" title="Last turn">
      End<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M6 6l7 6-7 6"/></svg>
    </button>
    <button id="cont" class="mini" type="button" aria-pressed="true" aria-label="Continuous play" title="Continuous play: on plays to the end, off stops after every turn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c-2-2.7-4-4-6-4a4 4 0 0 0 0 8c2 0 4-1.3 6-4zm0 0c2 2.7 4 4 6 4a4 4 0 0 0 0-8c-2 0-4 1.3-6 4z"/></svg>
    </button>
  </div>
  <p class="foot">{{FOOTER}}</p>
</div>

<!-- syntax highlighting; async so a slow CDN never holds the player back: code shown before it loads stays plain -->

const EVENTS = {{DATA}};
